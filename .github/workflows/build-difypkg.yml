name: Build .difypkg

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      cli_version:
        description: "dify-plugin CLI version (e.g. 0.6.1)"
        required: false
        default: "0.6.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLI_VERSION: ${{ github.event.inputs.cli_version || '0.6.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin metadata
        id: meta
        run: |
          NAME=$(grep -E '^name:' manifest.yaml | awk '{print $2}')
          VERSION=$(grep -E '^version:' manifest.yaml | awk '{print $2}')
          AUTHOR=$(grep -E '^author:' manifest.yaml | awk '{print $2}')
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "author=${AUTHOR}" >> "$GITHUB_OUTPUT"
          echo "pkg=${AUTHOR}-${NAME}_${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download dify-plugin CLI
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/dify-plugin" \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/${CLI_VERSION}/dify-plugin-linux-amd64"
          chmod +x "${RUNNER_TEMP}/dify-plugin"
          "${RUNNER_TEMP}/dify-plugin" version

      - name: Package plugin
        run: |
          "${RUNNER_TEMP}/dify-plugin" plugin package . -o "${RUNNER_TEMP}/${{ steps.meta.outputs.pkg }}.difypkg"
          mv "${RUNNER_TEMP}/${{ steps.meta.outputs.pkg }}.difypkg" .
          ls -lh *.difypkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.pkg }}
          path: "*.difypkg"
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.difypkg"
